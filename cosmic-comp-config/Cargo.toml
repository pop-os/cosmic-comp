[package]
name = "cosmic-comp-config"
version = "1.0.0"
edition = "2024"

[dependencies]
cosmic-config = { git = "https://github.com/playtron-os/libcosmic" }
cosmic-randr-shell = { git = "https://github.com/pop-os/cosmic-randr/", optional = true }
input = "0.10.0"
libdisplay-info = { version = "0.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
ron = { version = "0.12", optional = true }
tracing = { version = "0.1.44", features = [
    "max_level_trace",
    # Must match the root crate's level: Cargo unifies tracing features across the
    # workspace, and tracing picks the LEAST verbose release_max_level_* when more
    # than one is enabled. Leaving `release_max_level_info` here would defeat the
    # root crate's `release_max_level_trace` and keep debug!/trace! compiled out.
    "release_max_level_trace",
], optional = true }

[features]
default = []
output = ["ron", "tracing"]
randr = ["cosmic-randr-shell", "output"]
