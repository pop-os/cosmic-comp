[package]
name = "cosmic-comp-ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
futures-util = { version = "0.3.34", features = ["io"], optional = true }
rustix = "1.1.6"

[features]
default = ["async"]
async = ["dep:futures-util"]
